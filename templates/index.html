<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#050914">

  <title>KP PANEL SHOP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Background glow -->
  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>
  <div class="glow glow-three"></div>

  <main class="page">

    <section class="auth-card">

      <!-- LOGO -->
      <div class="logo-area">

        <!--
          Agar logo.png nahi lagana hai to is image ko remove
          karke neeche wala text use kar sakte ho.
        -->
        <img
          src="logo.png"
          class="logo"
          alt="KP PANEL SHOP"
          onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';"
        >

        <div id="logoFallback" class="logo-fallback">
          <div class="kp">KP</div>
          <div class="panel">PANEL</div>
          <div class="shop">SHOP</div>
        </div>

      </div>


      <!-- =========================
           LOGIN PAGE
      ========================== -->

      <div id="loginPage" class="auth-page">

        <h1>
          KP PANEL <span>SHOP</span>
        </h1>

        <p class="subtitle">
          KP PANEL MEANS THE HARDCORE LAYER OF TRUST
        </p>


        <form id="loginForm">

          <!-- USERNAME -->
          <div class="field">

            <label for="loginUsername">
              USERNAME OR EMAIL
            </label>

            <input
              id="loginUsername"
              type="text"
              placeholder="Enter your username or email"
              autocomplete="username"
              required
            >

          </div>


          <!-- PASSWORD -->
          <div class="field">

            <label for="loginPassword">
              PASSWORD
            </label>

            <div class="password-wrapper">

              <input
                id="loginPassword"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                data-target="loginPassword"
              >
                👁
              </button>

            </div>

          </div>


          <!-- LOGIN -->
          <button
            type="submit"
            class="primary-button"
          >
            SIGN IN NOW
          </button>

        </form>


        <!-- GOOGLE LOGIN -->

        <button
          type="button"
          id="googleLogin"
          class="google-button"
        >

          <span class="google-logo">
            G
          </span>

          <span>
            Login with Google
          </span>

        </button>


        <!-- LOGIN MESSAGE -->

        <div
          id="loginMessage"
          class="message"
        ></div>


        <!-- CREATE ACCOUNT -->

        <button
          type="button"
          id="openRegister"
          class="secondary-button"
        >
          CREATE NEW ACCOUNT
        </button>

      </div>



      <!-- =========================
           REGISTER PAGE
      ========================== -->

      <div
        id="registerPage"
        class="auth-page hidden"
      >

        <h1>
          Create <span>Account</span>
        </h1>

        <p class="subtitle">
          Join KP PANEL SHOP — The Hardcore Layer of Trust
        </p>


        <form id="registerForm">

          <!-- USERNAME -->

          <div class="field">

            <label for="registerUsername">
              USERNAME <strong>*</strong>
            </label>

            <input
              id="registerUsername"
              type="text"
              placeholder="Choose a unique username"
              minlength="3"
              autocomplete="username"
              required
            >

          </div>


          <!-- EMAIL -->

          <div class="field">

            <label for="registerEmail">
              EMAIL
              <span class="optional">
                (OPTIONAL)
              </span>
            </label>

            <input
              id="registerEmail"
              type="email"
              placeholder="yourname@gmail.com"
              autocomplete="email"
            >

          </div>


          <!-- PASSWORD -->

          <div class="field">

            <label for="registerPassword">
              PASSWORD <strong>*</strong>
            </label>

            <div class="password-wrapper">

              <input
                id="registerPassword"
                type="password"
                placeholder="Create password (min 6 chars)"
                minlength="6"
                autocomplete="new-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                data-target="registerPassword"
              >
                👁
              </button>

            </div>

          </div>


          <!-- REGISTER -->

          <button
            type="submit"
            class="primary-button"
          >
            REGISTER ACCOUNT NOW
          </button>

        </form>


        <!-- GOOGLE REGISTER -->

        <button
          type="button"
          id="googleRegister"
          class="google-button"
        >

          <span class="google-logo">
            G
          </span>

          <span>
            Login with Google
          </span>

        </button>


        <!-- REGISTER MESSAGE -->

        <div
          id="registerMessage"
          class="message"
        ></div>


        <!-- LOGIN -->

        <button
          type="button"
          id="openLogin"
          class="secondary-button"
        >

          ALREADY HAVE AN ACCOUNT?

          <br>

          SIGN IN

        </button>

      </div>

    </section>

  </main>


  <!-- TOAST -->

  <div
    id="toast"
    class="toast"
  ></div>


  <script src="app.js"></script>

</body>
</html>
