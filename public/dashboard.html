<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - KP Panel Shop</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding-top: 50px; }
        .container { background-color: #1f1f1f; padding: 20px; border-radius: 10px; display: inline-block; width: 300px; }
        button { background-color: #ff4757; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome, <span id="usernameDisplay">User</span>!</h1>
        <p>This is your customer dashboard.</p>
        <button id="logoutBtn">Logout</button>
    </div>

    <script>
        const session = localStorage.getItem("kp_panel_current_user");
        if (!session) {
            window.location.href = "index.html";
        } else {
            const user = JSON.parse(session);
            document.getElementById("usernameDisplay").textContent = user.username;
        }

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.removeItem("kp_panel_current_user");
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
